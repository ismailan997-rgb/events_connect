<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4880a"/>
    </linearGradient>

    <!-- Bright Gold Highlight -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Emerald Glow for WhatsApp / Connect -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10e8a0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" ry="124" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="256" r="150" fill="#f5a623" opacity="0.12"/>

  <!-- Interlocking Connection Orbit Rings -->
  <path d="M 175 256 C 175 204, 212 168, 264 168 C 310 168, 342 200, 342 242 C 342 278, 312 306, 272 306" 
        fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 337 256 C 337 308, 300 344, 248 344 C 202 344, 170 312, 170 270 C 170 234, 200 206, 240 206" 
        fill="none" stroke="url(#goldLight)" stroke-width="24" stroke-linecap="round"/>

  <!-- Center Celebratory Starburst (Bold, crisp 4-point star) -->
  <path d="M 256 96 Q 256 220 132 256 Q 256 292 256 416 Q 256 292 380 256 Q 256 220 256 96 Z" 
        fill="url(#goldLight)"/>

  <!-- Diagonal inner star flare -->
  <path d="M 256 168 Q 256 232 192 256 Q 256 280 256 344 Q 256 280 320 256 Q 256 232 256 168 Z" 
        fill="#ffffff" opacity="0.9"/>

  <!-- Core Radiant Center -->
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>

  <!-- Connection Nodes (Emerald & Gold) -->
  <circle cx="390" cy="184" r="18" fill="url(#glowGrad)"/>
  <circle cx="122" cy="328" r="14" fill="#ffd166"/>
</svg>
